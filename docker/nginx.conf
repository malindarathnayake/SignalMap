worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout main;

  # Resolver for dynamic upstream lookup (docker DNS).
  # ndots:0 prevents prepending search domains to the bare service name.
  resolver 127.0.0.11 ipv6=off valid=10s;

  # API upstream — signalmap-api service in the compose network.
  # Indirected via $upstream so nginx starts even if the api container
  # is briefly down (avoids "host not found in upstream" on boot).
  map $request_uri $signalmap_api {
    default "http://signalmap-api:3000";
  }

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip_static on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain application/xml text/xml image/svg+xml;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080 default_server;
    http2 on;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — immutable cache
    location /assets/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Topojson world map data — large, cache aggressively
    location /topojson/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Favicons + .well-known
    location /favico/        { try_files $uri =404; }
    location /.well-known/   { try_files $uri =404; }
    location = /robots.txt   { try_files $uri =404; }
    location = /sitemap.xml  { try_files $uri =404; }
    location = /openapi.yaml { try_files $uri =404; }

    # SignalMap SSE stream — must NOT buffer; chunked transfer; long timeout.
    # This block must be defined BEFORE the generic /api/ block so it wins.
    location = /api/signalmap/stream {
      proxy_pass $signalmap_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      # SSE specifics
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      chunked_transfer_encoding off;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header X-Accel-Buffering "no" always;
    }

    # SignalMap API — proxy to signalmap-api:3000 in the compose network.
    # If the upstream is unreachable, fall back to baked fixtures (so the
    # static-only image still shows degraded UI), then to a JSON 503.
    location ~ ^/api/(?<api_path>.+)$ {
      proxy_pass $signalmap_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_intercept_errors on;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      # On 502/503/504 from upstream, fall through to baked fixture if any,
      # else to a clean JSON 503.
      error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
      default_type application/json;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      # Allow POST endpoints to use the fallback file too.
      error_page 405 =200 $uri;
      try_files /api/$api_path.json @api_unavailable;
    }

    location @api_unavailable {
      default_type application/json;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      return 503 '{"error":{"code":"backend_unavailable","message":"signalmap-api is not reachable from the UI container."}}';
    }

    # SPA fallback — every other route serves index.html
    location / {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      # Allow YouTube iframe storage-access requests (Live cameras tab).
      add_header Permissions-Policy 'storage-access=(self "https://www.youtube.com" "https://youtube.com")';
      try_files $uri $uri/ /index.html;
    }
  }
}
