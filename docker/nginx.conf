worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip_static on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain application/xml text/xml image/svg+xml;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080 default_server;
    http2 on;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — immutable cache
    location /assets/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Topojson world map data — large, cache aggressively
    location /topojson/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Favicons + .well-known
    location /favico/        { try_files $uri =404; }
    location /.well-known/   { try_files $uri =404; }
    location = /robots.txt   { try_files $uri =404; }
    location = /sitemap.xml  { try_files $uri =404; }
    location = /openapi.yaml { try_files $uri =404; }

    # SignalMap API — backend not bundled in this image. Pre-baked
    # fixture responses live at /api/<path>.json (written by
    # scripts/bake-fixtures.mjs at build time). nginx tries that first,
    # then falls back to a clean JSON 503 so the SPA can show degraded
    # state instead of an nginx HTML 502.
    location ~ ^/api/(?<api_path>.+)$ {
      default_type application/json;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      # Some SPA endpoints are POST (e.g. /api/signalmap/brief/event/<id>);
      # nginx rejects POST on static files with 405 by default. Rewrite to 200.
      error_page 405 =200 $uri;
      try_files /api/$api_path.json @api_unavailable;
    }

    location @api_unavailable {
      default_type application/json;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      return 503 '{"error":{"code":"backend_unavailable","message":"This endpoint requires the SignalMap backend service which is not bundled in the static-only image."}}';
    }

    # SPA fallback — every other route serves index.html
    location / {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      # Allow YouTube iframe storage-access requests (Live cameras tab).
      add_header Permissions-Policy 'storage-access=(self "https://www.youtube.com" "https://youtube.com")';
      try_files $uri $uri/ /index.html;
    }
  }
}
