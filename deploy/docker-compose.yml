name: signalmap

# ─────────────────────────────────────────────────────────────────────────────
# SignalMap — deploy compose file
#
# This file pulls pre-built images from GitHub Container Registry (no local
# build step required). Images are published by the `Release` workflow on
# every `vX.Y.Z` tag push.
#
# Quick start on a fresh host:
#   1. Install Docker Engine + Compose plugin.
#   2. Copy this folder somewhere persistent (e.g. /opt/signalmap).
#   3. cp .env.example .env  → edit values (REDIS_PASSWORD, API keys).
#   4. Generate an admin token:
#        openssl rand -hex 32 > secrets/SIGNALMAP_ADMIN_TOKEN
#   5. docker compose up -d
#   6. Open http://<host>:8080
#
# To pin a specific version, set `SIGNALMAP_VERSION=4.0.0` in your .env.
# Default `latest` always tracks the most recent published tag.
# ─────────────────────────────────────────────────────────────────────────────

x-node-base: &node-base
  image: ghcr.io/${SIGNALMAP_REPO_OWNER:-malindarathnayake}/signalmap-node:${SIGNALMAP_VERSION:-latest}
  restart: unless-stopped
  init: true
  pull_policy: always
  depends_on:
    redis:
      condition: service_healthy

x-node-env: &node-env
  REDIS_URL: "redis://:${REDIS_PASSWORD}@signalmap-redis:6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
  SIGNALMAP_BACKEND_MODE: "${SIGNALMAP_BACKEND_MODE:-live}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
  PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY:-}"
  SIGNALMAP_LLM_MODELS: "${SIGNALMAP_LLM_MODELS:-}"
  SIGNALMAP_LLM_MAX_OUTPUT_TOKENS: "${SIGNALMAP_LLM_MAX_OUTPUT_TOKENS:-768}"
  SIGNALMAP_DAILY_LLM_BUDGET_USD: "${SIGNALMAP_DAILY_LLM_BUDGET_USD:-2.00}"
  CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"

services:
  redis:
    image: docker.io/redis:7-alpine
    container_name: signalmap-redis
    command: >
      redis-server
        --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly no
    volumes:
      - signalmap-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - signalmap-net

  signalmap-api:
    <<: *node-base
    container_name: signalmap-api
    command: ["api"]
    environment:
      <<: *node-env
      SIGNALMAP_API_PORT: "3000"
      SIGNALMAP_BRIEF_PER_EVENT_LOCK_TIMEOUT_SECONDS: "${SIGNALMAP_BRIEF_PER_EVENT_LOCK_TIMEOUT_SECONDS:-300}"
      SIGNALMAP_BRIEF_PER_EVENT_RATE_LIMIT_PER_MIN: "${SIGNALMAP_BRIEF_PER_EVENT_RATE_LIMIT_PER_MIN:-20}"
      SIGNALMAP_BRIEF_EVENT_EST_COST_USD: "${SIGNALMAP_BRIEF_EVENT_EST_COST_USD:-0.05}"
      SSE_HEARTBEAT_SECONDS: "${SSE_HEARTBEAT_SECONDS:-20}"
    secrets:
      - SIGNALMAP_ADMIN_TOKEN
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/signalmap/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    expose:
      - "3000"
    networks:
      - signalmap-net

  signalmap-collector:
    <<: *node-base
    container_name: signalmap-collector
    command: ["collector"]
    environment:
      <<: *node-env
      SIGNALMAP_RSS_POLL_MINUTES: "${SIGNALMAP_RSS_POLL_MINUTES:-15}"
      SIGNALMAP_COLLECTOR_LEASE_TTL_SEC: "${SIGNALMAP_COLLECTOR_LEASE_TTL_SEC:-60}"
      SIGNALMAP_VECTOR_ENABLED: "${SIGNALMAP_VECTOR_ENABLED:-true}"
      SIGNALMAP_EMBEDDING_MODEL: "${SIGNALMAP_EMBEDDING_MODEL:-openai/text-embedding-3-small}"
      SIGNALMAP_EMBEDDING_DIM: "${SIGNALMAP_EMBEDDING_DIM:-1536}"
      SIGNALMAP_LANCEDB_URI: "/data/signalmap/lancedb"
      SIGNALMAP_DATA_DIR: "/data/signalmap"
      SIGNALMAP_DISTILL_ROOT: "/app/vendor/distill"
      SIGNALMAP_DISTILL_TIMEOUT_MS: "${SIGNALMAP_DISTILL_TIMEOUT_MS:-15000}"
      SIGNALMAP_NEWS_ITEMS_PER_SOURCE: "${SIGNALMAP_NEWS_ITEMS_PER_SOURCE:-5}"
      SIGNALMAP_NEWS_WINDOW_HOURS: "${SIGNALMAP_NEWS_WINDOW_HOURS:-24}"
      SIGNALMAP_NEWS_COLD_BOOT_HOURS: "${SIGNALMAP_NEWS_COLD_BOOT_HOURS:-6}"
      SIGNALMAP_EVENT_CONFIDENCE_MIN: "${SIGNALMAP_EVENT_CONFIDENCE_MIN:-0.7}"
      NEWSAPI_API_KEY: "${NEWSAPI_API_KEY:-}"
      NEWSAPI_PAGE_SIZE: "${NEWSAPI_PAGE_SIZE:-20}"
      TRANSFORMERS_CACHE: "/data/signalmap/models"
      HF_HOME: "/data/signalmap/models"
    volumes:
      - signalmap-lancedb:/data/signalmap/lancedb
      - signalmap-models:/data/signalmap/models
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h signalmap-redis -a \"$$REDIS_PASSWORD\" --no-auth-warning EXISTS signalmap:collector:heartbeat | grep -q 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: 1.0
    networks:
      - signalmap-net

  signalmap-cron:
    <<: *node-base
    container_name: signalmap-cron
    command: ["cron"]
    environment:
      <<: *node-env
      SIGNALMAP_BRIEF_REFRESH_MINUTES: "${SIGNALMAP_BRIEF_REFRESH_MINUTES:-30}"
      SIGNALMAP_CRON_LEASE_TTL_SEC: "${SIGNALMAP_CRON_LEASE_TTL_SEC:-60}"
    secrets:
      - SIGNALMAP_ADMIN_TOKEN
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h signalmap-redis -a \"$$REDIS_PASSWORD\" --no-auth-warning EXISTS signalmap:brief:cron:heartbeat | grep -q 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - signalmap-net

  signalmap-ui:
    image: ghcr.io/${SIGNALMAP_REPO_OWNER:-malindarathnayake}/signalmap-ui:${SIGNALMAP_VERSION:-latest}
    container_name: signalmap-ui
    pull_policy: always
    ports:
      - "${SIGNALMAP_PORT:-8080}:8080"
    depends_on:
      signalmap-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    networks:
      - signalmap-net

networks:
  signalmap-net:
    driver: bridge

secrets:
  SIGNALMAP_ADMIN_TOKEN:
    file: ${SIGNALMAP_ADMIN_TOKEN_FILE:-./secrets/SIGNALMAP_ADMIN_TOKEN}

volumes:
  signalmap-redis-data:
  signalmap-lancedb:
  signalmap-models:
